name: Galaxy XR applications
on:
  push:
    tags: ['galaxyxr-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Check release version
        run: python3 tools/check_release_version.py
      - name: Build and check adapter and dispatcher
        run: |
          sdkmanager 'ndk;29.0.14206865' 'cmake;3.22.1'
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          export CMAKE_DIR="$ANDROID_HOME/cmake/3.22.1/bin"
          bash native/galaxyxr/build_dispatcher.sh
          python3 native/galaxyxr/generate_forwarders.py
          git diff --exit-code -- native/galaxyxr/forwarders.inc
          bash native/galaxyxr/build.sh
          mkdir -p native/galaxyxr/build
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Wno-missing-field-initializers -Inative/galaxyxr/include native/galaxyxr/test_policy.cpp -ldl -pthread -o native/galaxyxr/build/test_policy
          native/galaxyxr/build/test_policy
          native/galaxyxr/build/test_policy app
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Wno-missing-field-initializers -Inative/galaxyxr/include native/galaxyxr/test_hand_tracking.cpp -ldl -pthread -o native/galaxyxr/build/test_hand_tracking
          native/galaxyxr/build/test_hand_tracking
          native/galaxyxr/build/test_hand_tracking edited
      - uses: actions/upload-artifact@v4
        with:
          name: galaxyxr-adapter
          path: overportcli/src/main/resources/galaxyxr/arm64-v8a/*.bin
          if-no-files-found: error

  android:
    needs: adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: galaxyxr-adapter
          path: overportcli/src/main/resources/galaxyxr/arm64-v8a
      - name: Restore Android signing key
        env:
          KEYSTORE: ${{ secrets.GXR_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os, base64, pathlib
          key = os.environ['KEYSTORE']
          if not key:
              raise SystemExit('Configure GXR_KEYSTORE_BASE64 and GXR_KEYSTORE_PASSWORD repository secrets first')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'galaxyxr-release.p12'
          path.write_bytes(base64.b64decode(key, validate=True))
          path.chmod(0o600)
          PY
      - name: Build signed APK and CLI
        env:
          GXR_KEYSTORE_FILE: ${{ runner.temp }}/galaxyxr-release.p12
          GXR_KEYSTORE_PASSWORD: ${{ secrets.GXR_KEYSTORE_PASSWORD }}
        run: |
          bash gradlew :composeApp:assembleRelease :overportcli:shadowJar --console=plain
          version=$(sed -n 's/^version=//p' galaxyxr.properties)
          mkdir -p dist
          cp composeApp/build/outputs/apk/release/composeApp-release.apk "dist/overport-galaxyxr-${version}-android.apk"
          cp overportcli/build/libs/*-all.jar "dist/overport-galaxyxr-${version}-cli.jar"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "dist/overport-galaxyxr-${version}-android.apk"
          python3 tools/check_packaged_adapter.py dist/*.apk dist/*.jar
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/galaxyxr-release.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: galaxyxr-android
          path: dist/*
          if-no-files-found: error

  windows:
    needs: adapter
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: galaxyxr-adapter
          path: overportcli/src/main/resources/galaxyxr/arm64-v8a
      - name: Build portable Windows application
        shell: pwsh
        run: |
          ./gradlew.bat :composeApp:desktopTest :composeApp:createReleaseDistributable --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/test_windows_updater.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = ((Get-Content galaxyxr.properties | Select-String '^version=').Line -split '=', 2)[1]
          $appDir = Resolve-Path composeApp/build/compose/binaries/main-release/app/OverportGalaxyXR
          if (!(Test-Path "$appDir/OverportGalaxyXR.exe")) { throw 'Missing Windows launcher' }
          if (!(Test-Path "$appDir/runtime/bin/server/jvm.dll")) { throw 'Missing bundled Java runtime' }
          python tools/check_packaged_adapter.py "$appDir"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $appDir -DestinationPath "dist/overport-galaxyxr-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: galaxyxr-windows
          path: dist/*.zip
          if-no-files-found: error

  desktop-unix:
    needs: adapter
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x64
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: galaxyxr-adapter
          path: overportcli/src/main/resources/galaxyxr/arm64-v8a
      - name: Build desktop application
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          bash gradlew :composeApp:desktopTest :composeApp:createReleaseDistributable --console=plain
          version=$(sed -n 's/^version=//p' galaxyxr.properties | tr -d '\r')
          mkdir -p dist
          base=composeApp/build/compose/binaries/main-release
          if [[ "$PLATFORM" == linux-* ]]; then
            test -x "$base/app/OverportGalaxyXR/bin/OverportGalaxyXR"
            test -f "$base/app/OverportGalaxyXR/lib/runtime/lib/server/libjvm.so"
            python3 tools/check_packaged_adapter.py "$base/app/OverportGalaxyXR"
            tar -czf "dist/overport-galaxyxr-$version-$PLATFORM.tar.gz" -C "$base/app" OverportGalaxyXR
          else
            test -x "$base/app/OverportGalaxyXR.app/Contents/MacOS/OverportGalaxyXR"
            test -f "$base/app/OverportGalaxyXR.app/Contents/runtime/Contents/Home/lib/server/libjvm.dylib"
            python3 tools/check_packaged_adapter.py "$base/app/OverportGalaxyXR.app"
            bash gradlew :composeApp:packageReleaseDmg --console=plain
            cp "$base"/dmg/*.dmg "dist/overport-galaxyxr-$version-$PLATFORM.dmg"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: galaxyxr-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [android, windows, desktop-unix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: galaxyxr-android
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: galaxyxr-windows
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: galaxyxr-linux-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: galaxyxr-macos-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum *.apk *.jar *.zip *.tar.gz *.dmg > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: galaxyxr-release
          path: dist/*
          if-no-files-found: error
      - name: Publish all applications
        if: startsWith(github.ref, 'refs/tags/galaxyxr-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version=//p' galaxyxr.properties)
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Overport Galaxy XR $version" --notes-file "docs/RELEASE-$version.md" dist/*
